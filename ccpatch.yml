# ──────────────────────────────────────────────────────────────────────────────
# ccpatch.yml — Patch feature flags
#
# Patch directories:
#   core/          Core patches — bug fixes + minimal infrastructure
#   extensions/    Features, observability, expose-internals
#
# Shorthand:    name: true     — enabled
#               name: false    — disabled (opt-in)
# Long form:    name:
#                 enabled: true
#                 env: [CC_FOO]
#
# make override (bypasses this file entirely):
#   make patch-claude-code PATCH=fetch_interceptor,bun_shim,...
#
# Strict mode (CI/release):
#   pass --strict to patch-cli.mjs or set CCPATCH_STRICT=1 — fails the build
#   on no-change, verify-fail, apply errors, or manifest violations.
# ──────────────────────────────────────────────────────────────────────────────
version: 1

# ──────────────────────────────────────────────────────────────────────────────
# bundle_sha: — Optional sha256 integrity gate on the input cli.js (#8)
#
# If a sha is listed for a version, `ccpatch build` will compute sha256 of the
# input bundle and fail (exit 1) if it does not match, UNLESS --allow-unverified
# is passed. This prevents accidentally applying patches to a wrong/tampered
# bundle.
#
# Generate the sha for a new version with:
#   node -e "const {createHash}=require('crypto'),{readFileSync}=require('fs');\
#     console.log(createHash('sha256').update(readFileSync(process.argv[1]))\
#     .digest('hex'))" /path/to/cli.js
#
# Example (fill in real values):
#   bundle_sha:
#     2.1.160: "deadbeef..."
# ──────────────────────────────────────────────────────────────────────────────
bundle_sha:
  # Add entries here as new Claude Code versions are released.
  # e.g.:  2.1.160: "abc123..."

# ──────────────────────────────────────────────────────────────────────────────
# ack: — Capability acknowledgements (default-strict gate)
#
# Patches that declare `network`, `exec`, `env`, `tools`, or `telemetry`
# capabilities require an explicit ack entry here before the build will proceed
# (this is the GATE_REQUIRED_CAPS set in runner/cli/capabilities.mjs — it fires
# unconditionally, not just under --strict). `tools` and `telemetry` were folded
# in so the headless RCE stack (expose_tool_dispatch / expose_agent_tool, both
# capabilities:["tools"]) and telemetry exfil patches can't slip through the
# default `make patch-claude-code` path without re-confirmation. By acknowledging
# a capability you confirm you've read THREAT_MODEL.md for that patch and
# understand the runtime privileges it claims.
#
# Pass --allow-unacked on the CLI to bypass this check (legacy warn-only mode).
# ──────────────────────────────────────────────────────────────────────────────
ack:
  # Core (always-on) capability patches.
  fetch_interceptor: [network]
  bun_shim: [env, network]
  project_root: [env]
  tool_result_error_content: [network]
  # standard-profile capability patches — pre-acked so the shipped default of
  # `make patch-claude-code` (PROFILE=standard) builds cleanly with no capability
  # warnings. Each entry lists the patch's FULL high-risk capability set (not just
  # the ack-required network/exec/env subset) so the broader capabilities gate is
  # also satisfied. Power-only patches (debug, webhook, save_conversations, …)
  # remain unacked on purpose: opting into `power` is an explicit choice that
  # should re-confirm the threat model.
  model: [env, network]
  custom_commands: [prompt, tools]
  context_budget_warn: [network, prompt]
  extended_thinking: [network, prompt, env]
  force_thinking: [env]
  tool_result_trim: [network, tools]
  hook_noise_mute: [exec]
  mcp_lazy: [network, tools]
  dotenv_loader: [env]
  block_tools: [env, tools]

patches:

  # ════════════════════════════════════════════════════════════════════════════
  # CORE  (core/)
  # Non-opinionated. Required for any patched build to work correctly.
  # ════════════════════════════════════════════════════════════════════════════

  # ── Infrastructure ──────────────────────────────────────────────────────────
  react_singleton: true           # required (phase:pre) — unify bundled React with host React
  esm_compat: true                # required (phase:post) — wrap CJS-IIFE for ESM, pre-load react+ink
  contracts: true                 # typed __ccp* registry — __ccpProvide / __ccpRequire with runtime version + shape checks
  coverage_kernel: false          # runtime hit counter for instrumented patches (off by default — diagnostics only)
  overlay_loader: true            # required (phase:pre) — single anchor that loads ./ccpatch-overlay.mjs
  fetch_interceptor: true         # fan-out fetch tee — required by tool_result_error_content and extensions

  # ── Bug Fixes ───────────────────────────────────────────────────────────────
  bun_shim: true              # required — Bun polyfill so bundle runs in Node.js
  stdin_da1_leak: true        # strip DA1/DA2 escape sequences from stdin
  message_normalizer: true    # guard display-item type crashes
  project_root: true          # projectRoot fallback so .cc/commands/ loads
  tool_result_error_content: true # Anthropic API requires non-empty content on is_error blocks
  boot_banner: true           # required — render ccpatch boot-log lines in a responsive box before the CC banner

  # ════════════════════════════════════════════════════════════════════════════
  # EXTENSIONS  (extensions/)
  # ════════════════════════════════════════════════════════════════════════════

  # ── Fixes (opinionated) ─────────────────────────────────────────────────────
  dotenv_loader: false       # load .env before any patch runs
  hook_noise_mute: false     # suppress known-noisy hook stderr chatter
  cache_ttl: false       # always 1h prompt-cache TTL (disables telemetry downgrade)
  grep_shadow: false     # disable grep/find shadow injection (ugrep compat)
  rate_limit: false          # skip retries on subscription limits, cap Retry-After at 30s
  large_content_guard: false # truncate oversized system-message content before terminal crash
  recap_strip_hint: false    # remove "(disable recaps in /config)" hint from recaps
  suppress_npm_deprecation: false # hide "switched from npm to native installer" banner (irrelevant for patched bundles)

  # ── Command System ───────────────────────────────────────────────────────────
  custom_commands: false     # slash-command registry (/costs, /stats, /export, /clear-cache)
  slash_dispatch: false      # route /commands typed into the prompt bar
  subagent_hooks_stub: false # no-op subagent event bus (contract publisher for expose_agent_tool)

  # ── Feature Unlocks ─────────────────────────────────────────────────────────
  durable_cron: false        # force isDurableCronEnabled() → true
  loop_dynamic: false        # unlock self-pacing loop + richer loop prompts
  unhide_features: false     # expose client-side gated features (bedrock, web-setup, etc.)
  extended_thinking: false   # inject thinking/effort via CC_THINKING + CC_EFFORT_LEVEL
  force_thinking: false      # force thinking in interactive sessions when CC_THINKING is set
  mcp_lazy: false            # serve cached tools/list immediately, refresh in background

  # ── Observability ───────────────────────────────────────────────────────────
  cost_tracker: false         # token usage + estimated cost in status bar
  context_budget_warn: false  # inject context-full warning at 85% of 200k limit
  tool_result_trim: false     # truncate oversized tool_result blocks before API send
  tools_log: false            # log all tool calls and results via SSE subscriber
  boost_project_commands: false # boost loadedFrom:commands_DEPRECATED to top of autocomplete

  # ── Expose Internals ────────────────────────────────────────────────────────
  expose_tool_dispatch: false     # MCP tool registry + health probe + invoker
  expose_api_client: false        # Anthropic SDK client via __ccpApiClient
  expose_submit_input: false      # React submit callback via __ccpSubmitInput
  expose_agent_tool: false        # native AgentTool via __ccpAgentTool
  expose_system_prompt: false     # __ccpSetSystemPrompt persona overlay (ADK swap handoff)
  prime_agent_tool_on_boot: false # prime AgentTool at React mount (no user input needed)
  capture_interactive_request: false # capture first /v1/messages shape for reuse

  # ── Optional (opt-in via env or flag) ───────────────────────────────────────
  model:                          # change default model
    enabled: false
    env: [CC_MODEL]

  block_tools:                    # block specific tools from use
    enabled: false
    env: [CC_BLOCKED_TOOLS]

  debug:                          # verbose API + tool debug logging
    enabled: false
    env: [CLAUDE_DEBUG]

  save_conversations:             # auto-save all conversations to JSON
    enabled: false
    env: [CC_SAVE_CONVERSATIONS]

  session_timer:                  # track session time and warn on long sessions
    enabled: false

  webhook:                        # send webhook on key events
    enabled: false
    env: [CC_WEBHOOK_URL]

  cache_responses:                # cache API responses (dev/testing only)
    enabled: false
    env: [CC_CACHE_RESPONSES]

  input_bar_color: false          # color the prompt input bar border green
  _overlay_example: false         # example: publish a value via the sibling overlay file (no bundle anchor)

  # ── Verticals (composed on top of the horizontals above) ────────────────────
  event_bus: false                # typed pub/sub (__ccpBus) — shared by orchestrator/bridge
  auth_token: false               # shared-secret loader (CC_BRIDGE_TOKEN / SIGHUP reload)
  agent_lifecycle: false          # emit turn.start/turn.end/agent.spawn/agent.exit on __ccpBus
  agent_tree: false               # parent→child subagent tree with per-node cost/tool accounting

  headless_bridge:                # NDJSON socket: hello/submit/dispatch/subscribe/cancel/bye
    enabled: false
    env: [CC_BRIDGE_ADDR, CC_BRIDGE_TOKEN, CC_BRIDGE_TOKEN_FILE, CC_BRIDGE_MAX_LINE]

# ──────────────────────────────────────────────────────────────────────────────
# Profiles — curated subsets selected via `--profile <name>` (or `-p`).
# When --profile is absent, behaviour is unchanged: every patch enabled above
# is applied. When set, only patches listed here are applied (other ccpatch.yml
# flags are ignored for that run).
#
# Naming must match patch names exactly (filename stems in core/ + extensions/).
# Order in this list does NOT affect patch ordering; runner phases/topoSort
# still own ordering.
# ──────────────────────────────────────────────────────────────────────────────
profiles:
  minimal:
    # Bug fixes + the minimum infra those fixes need to run.
    - react_singleton
    - esm_compat
    - contracts
    - overlay_loader
    - fetch_interceptor
    - bun_shim
    - stdin_da1_leak
    - message_normalizer
    - project_root
    - tool_result_error_content
    - boot_banner
    - subagent_hooks_stub

  standard:
    # minimal + quality-of-life features.
    extends: minimal
    patches:
      - model
      - custom_commands
      - slash_dispatch
      - context_budget_warn
      - recap_strip_hint
      - suppress_npm_deprecation
      - unhide_features
      - extended_thinking
      - force_thinking
      - tool_result_trim
      - large_content_guard
      - hook_noise_mute
      - mcp_lazy
      - dotenv_loader
      - block_tools
      - input_bar_color

  # power lists everything explicitly -- no extends
  power:
    # Every patch currently listed under `patches:` above.
    - react_singleton
    - esm_compat
    - contracts
    - overlay_loader
    - fetch_interceptor
    - bun_shim
    - stdin_da1_leak
    - message_normalizer
    - project_root
    - tool_result_error_content
    - boot_banner
    - dotenv_loader
    - hook_noise_mute
    - cache_ttl
    - grep_shadow
    - rate_limit
    - large_content_guard
    - recap_strip_hint
    - suppress_npm_deprecation
    - custom_commands
    - slash_dispatch
    - subagent_hooks_stub
    - durable_cron
    - loop_dynamic
    - unhide_features
    - extended_thinking
    - force_thinking
    - mcp_lazy
    - cost_tracker
    - context_budget_warn
    - tool_result_trim
    - tools_log
    - boost_project_commands
    - expose_tool_dispatch
    - expose_api_client
    - expose_submit_input
    - expose_agent_tool
    - expose_system_prompt
    - prime_agent_tool_on_boot
    - capture_interactive_request
    - model
    - block_tools
    - debug
    - save_conversations
    - session_timer
    - webhook
    - cache_responses
    - input_bar_color

  # ⚠ SECURITY: the daemon / daemon_native / orchestrator profiles below compose
  # the full headless remote-control stack — expose_tool_dispatch +
  # expose_api_client + expose_agent_tool + expose_submit_input + headless_bridge.
  # Together these expose the native AgentTool, the Anthropic SDK client, and an
  # NDJSON socket that can submit input and dispatch tools from outside the
  # process: effectively remote code/tool execution. They declare `tools`,
  # `network`, and `telemetry` capabilities, which are ALL gate-required (see the
  # ack: block above). These profiles are intentionally NOT pre-acked: building
  # one fails loud unless you explicitly acknowledge each capability per patch in
  # the ack: block, or pass --strict --allow-capabilities <list> (or the blunt
  # --allow-capabilities=all). The point is to force re-confirmation of the threat
  # model every time the RCE stack is built — do not pre-ack these here.
  daemon:
    # Headless / automation vertical — drive the running CLI from outside.
    extends: minimal
    patches:
      - event_bus
      - auth_token
      - expose_api_client
      - expose_submit_input
      - expose_tool_dispatch
      - expose_agent_tool
      - capture_interactive_request
      - durable_cron
      - loop_dynamic
      - webhook
      - save_conversations
      - assistant_stream_events
      - headless_bridge

  # does not extend daemon -- intentionally excludes esm_compat and bun_shim (Bun SEA incompatible)
  daemon_native:
    # Same as `daemon`, minus esm_compat + bun_shim. Use this for the
    # native-binary repack path (patch-claude-code-native) where those two
    # rewrite the CJS wrapper into ESM `import` form that can't be re-embedded
    # back into the Bun SEA binary.
    - react_singleton
    - contracts
    - overlay_loader
    - fetch_interceptor
    - stdin_da1_leak
    - message_normalizer
    - project_root
    - tool_result_error_content
    - boot_banner
    - subagent_hooks_stub
    - event_bus
    - auth_token
    - expose_api_client
    - expose_submit_input
    - expose_tool_dispatch
    - expose_agent_tool
    - capture_interactive_request
    - headless_bridge

  orchestrator:
    # Multi-agent orchestration vertical — observe and account for the agent tree.
    extends: minimal
    patches:
      - subagent_hooks_stub
      - agent_lifecycle
      - event_bus
      - expose_agent_tool
      - expose_system_prompt
      - prime_agent_tool_on_boot
      - tools_log
      - tool_result_trim
      - cost_tracker
      - save_conversations
      - agent_tree
