# ──────────────────────────────────────────────────────────────────────────────
# ccpatch.yml — Patch feature flags
#
# Patch directories:
#   core/          Core patches — bug fixes + minimal infrastructure
#   extensions/    Features, observability, expose-internals
#
# Shorthand:    name: true     — enabled
#               name: false    — disabled (opt-in)
# Long form:    name:
#                 enabled: true
#                 env: [CC_FOO]
#
# make override (bypasses this file entirely):
#   make patch-claude-code PATCH=fetch_interceptor,bun_shim,...
#
# Strict mode (CI/release):
#   pass --strict to patch-cli.mjs or set CCPATCH_STRICT=1 — fails the build
#   on no-change, verify-fail, apply errors, or manifest violations.
# ──────────────────────────────────────────────────────────────────────────────
version: 1

# ──────────────────────────────────────────────────────────────────────────────
# Bundle integrity (sha256 pinning) does NOT live in this file.
#
# The single source of truth is storage/known-shas.json, enforced by
# scripts/verify-bundle-sha.mjs before any patching happens (fail-closed on a
# known-version mismatch, TOFU for unknown versions). Manage pins with:
#
#   ccpatch pin <version>          # pin the extracted bundle's sha256
#
# A `bundle_sha:` block in this file is ignored (the old #8 mechanism was
# removed in favor of the registry above).
# ──────────────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────────────
# ack: — Capability acknowledgements (default-strict gate)
#
# Patches that declare `network`, `exec`, `env`, `tools`, or `telemetry`
# capabilities require an explicit ack entry here before the build will proceed
# (this is the GATE_REQUIRED_CAPS set in runner/cli/capabilities.mjs — it fires
# unconditionally, not just under --strict). `tools` and `telemetry` were folded
# in so the headless RCE stack (expose_tool_dispatch / expose_agent_tool, both
# capabilities:["tools"]) and telemetry exfil patches can't slip through the
# default `make patch-claude-code` path without re-confirmation. By acknowledging
# a capability you confirm you've read THREAT_MODEL.md for that patch and
# understand the runtime privileges it claims.
#
# Pass --allow-unacked on the CLI to bypass this check (legacy warn-only mode).
# ──────────────────────────────────────────────────────────────────────────────
ack:
  # Core (always-on) capability patches.
  fetch_interceptor: [network]
  bun_shim: [env, network]
  project_root: [env]
  tool_result_error_content: [network]
  # standard-profile capability patches — pre-acked so the shipped default of
  # `make patch-claude-code` (PROFILE=standard) builds cleanly with no capability
  # warnings. Each entry lists the patch's FULL high-risk capability set (not just
  # the ack-required network/exec/env subset) so the broader capabilities gate is
  # also satisfied. Power-only patches NOT pulled in by a shipped profile (e.g.
  # debug, cost_tracker, …) remain unacked on purpose: opting into `power` is an
  # explicit choice that should re-confirm the threat model. The daemon profile's
  # capability patches ARE acked below (see the "daemon / headless-bridge stack"
  # block) so `make patch-daemon` builds without --allow-unacked.
  model: [env, network]
  custom_commands: [prompt, tools]
  context_budget_warn: [network, prompt]
  extended_thinking: [network, prompt, env]
  force_thinking: [env]
  tool_result_trim: [network, tools]
  hook_noise_mute: [exec]
  mcp_lazy: [network, tools]
  dotenv_loader: [env]
  block_tools: [env, tools]
  # ADK wiring — expose_tool_dispatch injects/dispatches tools (the headless RCE
  # surface), adk_hello_agent injects a tool through the ADK, expose_system_prompt
  # writes the persona overlay. Acked here so the default build proceeds; see
  # THREAT_MODEL.md for the tool-dispatch trust boundary (nonce-gated registrar).
  # expose_tool_dispatch's ack covers its full honest set: tools (dispatch),
  # network (MCP-socket-adjacent ops), exec (__ccpInvokeTool runs subprocess-
  # executing tools outside the interactive permission loop).
  expose_tool_dispatch: [tools, network, exec]
  expose_system_prompt: [prompt]
  adk_hello_agent: [tools]
  # adk_user_agents runs arbitrary user-authored ADK modules from ~/.ccpatch/agents/
  # — those modules inject tools (tools) and may swap personas (prompt).
  adk_user_agents: [tools, prompt]
  # adk_handoff_demo is the end-to-end ADK reference consumer: it injects
  # transfer_to_* tools (tools) and a swap may overlay a persona (prompt).
  adk_handoff_demo: [tools, prompt]
  # adk profile additions (delegate + router capabilities for the full ADK
  # surface). prime_agent_tool_on_boot primes the native AgentTool so delegate
  # handoffs resolve; expose_submit_input drives the input bar for AgentRouter.
  # expose_agent_tool is acked in the daemon block below (shared producer).
  prime_agent_tool_on_boot: [tools]
  expose_submit_input: [prompt]
  # daemon / headless-bridge stack — the patches the `daemon` profile adds on top
  # of `minimal`. This is the most powerful profile in the corpus (headless agent
  # loop + tool dispatch + an external control bridge), so each ack is a
  # deliberate, auditable acknowledgement of THREAT_MODEL.md's headless trust
  # boundary, NOT a convenience. Acked here so `make patch-daemon` builds without
  # the blunt --allow-unacked bypass. Each entry lists the patch's FULL declared
  # capability set so both the ack gate and the broader capabilities gate pass.
  event_bus: [telemetry]
  auth_token: [env, fs]
  expose_api_client: [network]
  expose_agent_tool: [tools]
  capture_interactive_request: [network, fs]
  webhook: [network, env, telemetry]
  save_conversations: [network, fs, env, telemetry]
  assistant_stream_events: [telemetry]
  headless_bridge: [network, prompt, tools, exec, env, fs]
  # standup_command rewrites the submitted prompt (prompt) and shells out to
  # `git log` / `git diff` in the CLI's cwd to gather recent activity (exec).
  # Acked so enabling the (disabled-by-default) extension builds without
  # --allow-unacked. The git invocation is read-only and fails open.
  standup_command: [prompt, exec]

patches:

  # ════════════════════════════════════════════════════════════════════════════
  # CORE  (core/)
  # Non-opinionated. Required for any patched build to work correctly.
  # ════════════════════════════════════════════════════════════════════════════

  # ── Infrastructure ──────────────────────────────────────────────────────────
  react_singleton: true           # required (phase:pre) — unify bundled React with host React
  esm_compat: true                # required (phase:post) — wrap CJS-IIFE for ESM, pre-load react+ink
  contracts: true                 # typed __ccp* registry — __ccpProvide / __ccpRequire with runtime version + shape checks
  coverage_kernel: false          # runtime hit counter for instrumented patches (off by default — diagnostics only)
  overlay_loader: true            # required (phase:pre) — single anchor that loads ./ccpatch-overlay.mjs
  fetch_interceptor: true         # fan-out fetch tee — required by tool_result_error_content and extensions

  # ── Bug Fixes ───────────────────────────────────────────────────────────────
  bun_shim: true              # required — Bun polyfill so bundle runs in Node.js
  stdin_da1_leak: true        # strip DA1/DA2 escape sequences from stdin
  message_normalizer: true    # guard display-item type crashes
  project_root: true          # projectRoot fallback so .cc/commands/ loads
  tool_result_error_content: true # Anthropic API requires non-empty content on is_error blocks
  boot_banner: true           # required — render ccpatch boot-log lines in a responsive box before the CC banner

  # ════════════════════════════════════════════════════════════════════════════
  # EXTENSIONS  (extensions/)
  # ════════════════════════════════════════════════════════════════════════════

  # ── Fixes (opinionated) ─────────────────────────────────────────────────────
  dotenv_loader: false       # load .env before any patch runs
  hook_noise_mute: false     # suppress known-noisy hook stderr chatter
  cache_ttl: false       # always 1h prompt-cache TTL (disables telemetry downgrade)
  grep_shadow: false     # disable grep/find shadow injection (ugrep compat)
  rate_limit: false          # skip retries on subscription limits, cap Retry-After at 30s
  large_content_guard: false # truncate oversized system-message content before terminal crash
  recap_strip_hint: false    # remove "(disable recaps in /config)" hint from recaps
  suppress_npm_deprecation: false # hide "switched from npm to native installer" banner (irrelevant for patched bundles)

  # ── Command System ───────────────────────────────────────────────────────────
  custom_commands: false     # slash-command registry (/costs, /stats, /export, /clear-cache)
  slash_dispatch: false      # route /commands typed into the prompt bar
  subagent_hooks_stub: false # no-op subagent event bus (contract publisher for expose_agent_tool)

  # ── Feature Unlocks ─────────────────────────────────────────────────────────
  durable_cron: false        # force isDurableCronEnabled() → true
  loop_dynamic: false        # unlock self-pacing loop + richer loop prompts
  unhide_features: false     # expose client-side gated features (bedrock, web-setup, etc.)
  extended_thinking: false   # inject thinking/effort via CC_THINKING + CC_EFFORT_LEVEL
  force_thinking: false      # force thinking in interactive sessions when CC_THINKING is set
  mcp_lazy: false            # serve cached tools/list immediately, refresh in background

  # ── Observability ───────────────────────────────────────────────────────────
  cost_tracker: false         # token usage + estimated cost in status bar
  context_budget_warn: false  # inject context-full warning at 85% of 200k limit
  tool_result_trim: false     # truncate oversized tool_result blocks before API send
  tools_log: false            # log all tool calls and results via SSE subscriber
  boost_project_commands: false # boost loadedFrom:commands_DEPRECATED to top of autocomplete

  # ── Expose Internals ────────────────────────────────────────────────────────
  expose_tool_dispatch: true      # MCP tool registry + health probe + invoker (ADK defineTool)
  expose_api_client: false        # Anthropic SDK client via __ccpApiClient
  expose_submit_input: false      # React submit callback via __ccpSubmitInput
  expose_agent_tool: false        # native AgentTool via __ccpAgentTool
  expose_system_prompt: true      # __ccpSetSystemPrompt persona overlay (ADK swap handoff)
  policy_gate: false              # host-driven behavior gate: soft steer + outbound allow/scrub/block. Mechanism only; inert until CCP_POLICY_GATE_MODULE points at a host module. KEPT by owner decision (COD-15); a canonical reference consumer ships at consumers/policy_gate.reference.cjs. Stays enabled:false (loading a module runs arbitrary host code → exec). See EXTENSIONS_API.md "policy_gate".
  prime_agent_tool_on_boot: false # prime AgentTool at React mount (no user input needed)
  capture_interactive_request: false # capture first /v1/messages shape for reuse

  # ── Optional (opt-in via env or flag) ───────────────────────────────────────
  model:                          # change default model
    enabled: false
    env: [CC_MODEL]

  block_tools:                    # block specific tools from use
    enabled: false
    env: [CC_BLOCKED_TOOLS]

  debug:                          # verbose API + tool debug logging
    enabled: false
    env: [CLAUDE_DEBUG]

  save_conversations:             # auto-save all conversations to JSON
    enabled: false
    env: [CC_SAVE_CONVERSATIONS]

  session_timer:                  # track session time and warn on long sessions
    enabled: false

  webhook:                        # send webhook on key events
    enabled: false
    env: [CC_WEBHOOK_URL]

  cache_responses:                # cache API responses (dev/testing only)
    enabled: false
    env: [CC_CACHE_RESPONSES]

  input_bar_color: false          # color the prompt input bar border green
  _overlay_example: false         # example: publish a value via the sibling overlay file (no bundle anchor)

  # ── ADK (Agent Development Kit) ──────────────────────────────────────────────
  # Loads @codehornets/adk into the patched session via the ccpatch-agents/ boot
  # block (the build copies the ADK runtime to ccpatch-adk/ next to the bundle).
  # Hard deps expose_tool_dispatch + expose_system_prompt are enabled above. For
  # delegate handoffs add expose_agent_tool + prime_agent_tool_on_boot; for the
  # event bus add event_bus.
  adk_hello_agent: true           # register a hello agent + adk_ping tool via the ADK
  adk_user_agents: false          # load user-authored ADK modules from ~/.ccpatch/agents/*.mjs (opt-in)
  adk_handoff_demo: false         # end-to-end consumer: defineHandoff (delegate+swap) + AgentRouter + createMemory (opt-in)

  # ── Verticals (composed on top of the horizontals above) ────────────────────
  event_bus: false                # typed pub/sub (__ccpBus) — shared by orchestrator/bridge
  auth_token: false               # shared-secret loader (CC_BRIDGE_TOKEN / SIGHUP reload)
  agent_lifecycle: false          # emit turn.start/turn.end/agent.spawn/agent.exit on __ccpBus
  agent_tree: false               # parent→child subagent tree with per-node cost/tool accounting
  assistant_stream_events: false  # re-emit Anthropic /v1/messages SSE events to __ccpBus

  headless_bridge:                # NDJSON socket: hello/submit/dispatch/subscribe/cancel/bye
    enabled: false
    env: [CC_BRIDGE_ADDR, CC_BRIDGE_TOKEN, CC_BRIDGE_TOKEN_FILE, CC_BRIDGE_MAX_LINE]

  # ── Scaffolded (disabled by default — flip to `true` to enable) ──────────────
  standup_command: false           # native /standup [N] — rewrite prompt with recent git activity for a standup summary

# ──────────────────────────────────────────────────────────────────────────────
# Profiles — curated subsets selected via `--profile <name>` (or `-p`).
# When --profile is absent, behaviour is unchanged: every patch enabled above
# is applied. When set, only patches listed here are applied (other ccpatch.yml
# flags are ignored for that run).
#
# Naming must match patch names exactly (filename stems in core/ + extensions/).
# Order in this list does NOT affect patch ordering; runner phases/topoSort
# still own ordering.
# ──────────────────────────────────────────────────────────────────────────────
profiles:
  # bare — the true bisection floor: ONLY the runtime-adaptation patches
  # without which the extracted bundle cannot execute under Node. Used by the
  # forensic workflow in docs/BISECTING.md to answer "is it the patches or the
  # runtime adaptation?". Profile selection never auto-includes `required:
  # true` patches, so this resolves to EXACTLY these three; the build prints a
  # loud ⚠⚠ warning that the skipped infra (contracts, fetch_interceptor,
  # overlay_loader, boot_banner — verified NOT load-bearing: the 3-patch build
  # exits 0 on --version and --help) makes subscriber-based patches silently
  # no-op. Why each member is load-bearing (drop-one verified on v2.1.175):
  #   esm_compat      — the extracted CJS-IIFE references module/require; as
  #                     .mjs under Node it throws before --version without
  #                     the ESM wrapper + react/ink preload.
  #   bun_shim        — first Bun.* call throws "ReferenceError: Bun is not
  #                     defined" (--help dies in Bun.stringWidth) without the
  #                     polyfill; only --version survives.
  #   react_singleton — without unifying bundled React with the host copy
  #                     preloaded by esm_compat, ink renders with two React
  #                     instances and the interactive REPL crashes on first
  #                     render (invalid-hook-call class; not exercised by
  #                     --version/--help, so keep it in the floor).
  bare:
    - react_singleton
    - esm_compat
    - bun_shim

  minimal:
    # Bug fixes + the minimum infra those fixes need to run.
    - react_singleton
    - esm_compat
    - contracts
    - overlay_loader
    - fetch_interceptor
    - bun_shim
    - stdin_da1_leak
    - message_normalizer
    - project_root
    - tool_result_error_content
    - boot_banner
    - subagent_hooks_stub

  standard:
    # minimal + quality-of-life features.
    extends: minimal
    patches:
      - model
      - custom_commands
      - slash_dispatch
      - context_budget_warn
      - recap_strip_hint
      - suppress_npm_deprecation
      - unhide_features
      - extended_thinking
      - force_thinking
      - tool_result_trim
      - large_content_guard
      - hook_noise_mute
      - mcp_lazy
      - dotenv_loader
      - block_tools
      - input_bar_color
      - standup_command

  # native = standard, minus the two patches that cannot survive a Bun SEA
  # repack. The exclusion itself is owned by runner/cli/native-profile.mjs
  # (applyNativeProfileFilter drops esm_compat + bun_shim whenever
  # profile === 'native'), so this entry only has to seed the base set —
  # listing them here would be redundant and they'd be filtered out anyway.
  # Use this for `make patch-claude-code-native` (the native-binary path).
  native:
    extends: standard
    patches: []

  # adk — standard + the full Agent Development Kit surface. Loads
  # @codehornets/adk into the session (adk_hello_agent's boot block) with EVERY
  # ccpatch primitive the ADK can consume wired up, so capabilities() reports all
  # five live, and ships adk_handoff_demo — the end-to-end reference consumer that
  # actually drives defineHandoff (delegate+swap) + AgentRouter + createMemory
  # through those primitives: tools (expose_tool_dispatch — already in standard), swap
  # (expose_system_prompt — already in standard), delegate (expose_agent_tool +
  # prime_agent_tool_on_boot), router (expose_submit_input), and bus (event_bus).
  #
  # SECURITY: this composes expose_tool_dispatch + expose_agent_tool +
  # expose_system_prompt — the same tools/prompt/exec/network capability set the
  # daemon profile gates. UNLIKE daemon, the ADK profile is intentionally
  # PRE-ACKED in the ack: block above (adk_hello_agent / expose_* entries), so
  # `--profile adk` builds without --allow-unacked. It deliberately does NOT pull
  # in expose_api_client or headless_bridge (no external NDJSON control socket),
  # so it is a strictly smaller surface than daemon — in-process agent
  # orchestration, not remote control.
  adk:
    extends: standard
    patches:
      # Hard deps of the ADK consumers below. These are globally `true` in the
      # per-patch flags above, but --profile IGNORES those flags (it resolves
      # ONLY the profiles: map), so they MUST be listed here explicitly or
      # adk_hello_agent / adk_handoff_demo build-fail at the dependsOn gate
      # ("requires expose_tool_dispatch, but it is not enabled"). Both are
      # already pre-acked in the ack: block above, so listing them here does not
      # widen the unacked-capability surface. (COD-13: without these two the adk
      # profile never builds, so the reference consumer could not ship.)
      - expose_tool_dispatch
      - expose_system_prompt
      - expose_agent_tool
      - prime_agent_tool_on_boot
      - expose_submit_input
      - event_bus
      - adk_hello_agent
      - adk_user_agents
      # adk_handoff_demo — the SHIPPED reference consumer (COD-13). It stays
      # globally `enabled: false`: flipping it true would build-fail the default
      # `make patch-claude-code` (whose expose_agent_tool is globally false) and
      # would pull the tools/prompt swap surface into every default build. Its
      # shipping vehicle is THIS curated profile, where every primitive it
      # consumes (tools / swap / delegate / router / bus) is wired and pre-acked.
      - adk_handoff_demo

  # power lists everything explicitly -- no extends
  power:
    # Every patch currently listed under `patches:` above.
    - react_singleton
    - esm_compat
    - contracts
    - overlay_loader
    - fetch_interceptor
    - bun_shim
    - stdin_da1_leak
    - message_normalizer
    - project_root
    - tool_result_error_content
    - boot_banner
    - dotenv_loader
    - hook_noise_mute
    - cache_ttl
    - grep_shadow
    - rate_limit
    - large_content_guard
    - recap_strip_hint
    - suppress_npm_deprecation
    - custom_commands
    - slash_dispatch
    - subagent_hooks_stub
    - durable_cron
    - loop_dynamic
    - unhide_features
    - extended_thinking
    - force_thinking
    - mcp_lazy
    - cost_tracker
    - context_budget_warn
    - tool_result_trim
    - tools_log
    - boost_project_commands
    - expose_tool_dispatch
    - expose_api_client
    - expose_submit_input
    - expose_agent_tool
    - expose_system_prompt
    - prime_agent_tool_on_boot
    - capture_interactive_request
    - model
    - block_tools
    - debug
    - save_conversations
    - session_timer
    - webhook
    - cache_responses
    - input_bar_color

  # ⚠ SECURITY: the daemon / daemon_native / orchestrator profiles below compose
  # the full headless remote-control stack — expose_tool_dispatch +
  # expose_api_client + expose_agent_tool + expose_submit_input + headless_bridge.
  # Together these expose the native AgentTool, the Anthropic SDK client, and an
  # NDJSON socket that can submit input and dispatch tools from outside the
  # process: effectively remote code/tool execution. They declare `tools`,
  # `network`, and `telemetry` capabilities, which are ALL gate-required (see the
  # ack: block above). These profiles are intentionally NOT pre-acked: building
  # one fails loud unless you explicitly acknowledge each capability per patch in
  # the ack: block, or pass --strict --allow-capabilities <list> (or the blunt
  # --allow-capabilities=all). The point is to force re-confirmation of the threat
  # model every time the RCE stack is built — do not pre-ack these here.
  daemon:
    # Headless / automation vertical — drive the running CLI from outside.
    extends: minimal
    patches:
      - event_bus
      - auth_token
      - expose_api_client
      - expose_submit_input
      - expose_tool_dispatch
      - expose_agent_tool
      - capture_interactive_request
      - durable_cron
      - loop_dynamic
      - webhook
      - save_conversations
      - assistant_stream_events
      - headless_bridge

  # does not extend daemon -- intentionally excludes esm_compat and bun_shim (Bun SEA incompatible)
  daemon_native:
    # Same as `daemon`, minus esm_compat + bun_shim. Use this for the
    # native-binary repack path (patch-claude-code-native) where those two
    # rewrite the CJS wrapper into ESM `import` form that can't be re-embedded
    # back into the Bun SEA binary.
    - react_singleton
    - contracts
    - overlay_loader
    - fetch_interceptor
    - stdin_da1_leak
    - message_normalizer
    - project_root
    - tool_result_error_content
    - boot_banner
    - subagent_hooks_stub
    - event_bus
    - auth_token
    - expose_api_client
    - expose_submit_input
    - expose_tool_dispatch
    - expose_agent_tool
    - capture_interactive_request
    - headless_bridge

  orchestrator:
    # Multi-agent orchestration vertical — observe and account for the agent tree.
    extends: minimal
    patches:
      - subagent_hooks_stub
      - agent_lifecycle
      - event_bus
      - expose_agent_tool
      - expose_system_prompt
      - prime_agent_tool_on_boot
      - tools_log
      - tool_result_trim
      - cost_tracker
      - save_conversations
      - agent_tree

  # ════════════════════════════════════════════════════════════════════════════
  # LAYER BOUNDARY  (arch review finding #4)
  #
  # `core` and `platform` name the two architectural layers of this repo as
  # selectable profiles, so the boundary the review identified is first-class and
  # gated, not just conceptual:
  #
  #   core     — the patch SUBSTRATE: the engine plus the load-bearing infra +
  #              bug-fix patches (== the `minimal` set). This is the stable
  #              anchor→transform→verify surface with a TIGHT capability budget
  #              (network, env only — see runner/layer-budgets.mjs). Nothing here
  #              opens a tool-dispatch / socket / agent surface.
  #
  #   platform — the ORCHESTRATION / observability layer that RIDES ON core:
  #              expose-internals, the ADK, the headless bridge, the agent-tree
  #              accounting bus. A different, WIDER threat surface (tools, exec,
  #              prompt, fs, telemetry) with its own capability budget. `platform`
  #              extends `core`, so core ⊆ platform by construction.
  #
  # Each layer has a SEPARATE strict-apply CI gate (.github/workflows/layer-gates
  # .yml) whose --allow-capabilities budget is sourced from runner/layer-budgets
  # .mjs. tests/layer-profiles.test.mjs asserts each layer's resolved patch set
  # declares no gate-required capability outside its budget — so a patch that
  # migrates layer and brings a new power CANNOT pass CI until the budget (and the
  # threat-model review it implies) is updated explicitly. That is the forcing
  # function the review asked for.
  #
  # These are ADDITIVE: they do NOT change the default build (PROFILE unset still
  # honours the per-patch `patches:` flags above). Select them with
  # `--profile core` / `--profile platform`.
  # ════════════════════════════════════════════════════════════════════════════
  core:
    # The substrate — identical to `minimal`, named to make the boundary explicit
    # and selectable. Keep in lock-step with `minimal`; layer-profiles.test.mjs
    # asserts core === minimal so the two can't silently diverge.
    extends: minimal
    patches: []

  platform:
    # Orchestration / expose-internals / observability layer on top of the
    # substrate. WIDER capability budget — see runner/layer-budgets.mjs. This is
    # the headless remote-control + agent-tree surface; it is intentionally NOT
    # pre-acked (see the daemon/orchestrator security note above) — building it
    # strict re-confirms the threat model per the layer CI gate.
    extends: core
    patches:
      - event_bus
      - auth_token
      - agent_lifecycle
      - agent_tree
      - assistant_stream_events
      - expose_tool_dispatch
      - expose_api_client
      - expose_submit_input
      - expose_agent_tool
      - expose_system_prompt
      - prime_agent_tool_on_boot
      - policy_gate
      - capture_interactive_request
      - headless_bridge
      - adk_hello_agent
      - tools_log
      - cost_tracker
