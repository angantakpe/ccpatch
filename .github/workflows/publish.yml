name: publish

# Publishes ccpatch to npm when a version tag (v*) is pushed.
#
# Flow:
#   1. Bump "version" in package.json and commit.
#   2. Tag the commit `vX.Y.Z` (matching the package.json version) and push the tag.
#   3. This workflow builds, sanity-checks, and runs `npm publish` with provenance.
#
# Requires the NPM_TOKEN repository secret (an npm automation token with
# publish rights to the `ccpatch` package). `id-token: write` lets npm attach
# a signed provenance attestation linking the tarball to this workflow run.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for `npm publish --provenance`

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Fail fast before publishing an irreversible release.
      - name: Run full test suite
        run: npm run test:all

      # Guard: the pushed tag must match the package.json version, so we never
      # publish a tarball whose version disagrees with the tag that triggered it.
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag version:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Inspect the tarball contents in the run log before the real publish.
      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
