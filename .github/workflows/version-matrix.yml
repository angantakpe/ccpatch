name: version-matrix

# Runs the patch suite + doctor across the last 3 published upstream
# Claude Code versions on every PR. Catches regressions before they ship.
#
# - `missing` on any matrix cell → PR fails.
# - `drift` on any matrix cell → PR comments but does not fail (drift is a
#   signal to re-anchor, not a blocker).
#
# Nightly `drift-check.yml` remains the leading indicator against `@latest`;
# this workflow is the lagging guard that PRs don't regress supported versions.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: version-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - id: list
        name: List last 3 upstream versions
        run: |
          # `npm view <pkg> versions --json` returns the full version array;
          # take the last 3 stable (non-prerelease) entries.
          ALL_JSON=$(npm view @anthropic-ai/claude-code versions --json)
          LAST3=$(node -e "
            const all = JSON.parse(process.argv[1]);
            const stable = all.filter(v => !/[-+]/.test(v));
            const last3 = stable.slice(-3);
            process.stdout.write(JSON.stringify(last3));
          " "$ALL_JSON")
          echo "Resolved: $LAST3"
          echo "versions=$LAST3" >> "$GITHUB_OUTPUT"

  matrix:
    needs: resolve-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.resolve-versions.outputs.versions) }}
    steps:
      # fetch-depth: 2 — on pull_request the checked-out ref is the PR merge
      # commit, so HEAD^1 is the base-branch tip; the refmap-freshness step
      # below uses `git diff HEAD^1 HEAD` to detect anchor-bearing changes.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # bun.lock is the single source of truth (see ci.yml); npm lockfile was
      # removed, so install via bun — `cache: npm` / `npm ci` cannot work here.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Cache upstream bundle for v${{ matrix.version }}
        id: cache-bundle
        uses: actions/cache@v4
        with:
          path: storage/archives/claude-code-v${{ matrix.version }}
          key: cc-bundle-${{ matrix.version }}

      - name: Download upstream bundle (cache miss)
        if: steps.cache-bundle.outputs.cache-hit != 'true'
        run: make download VERSION=${{ matrix.version }}

      - name: Locate bundle path
        id: locate
        run: |
          DIR="storage/archives/claude-code-v${{ matrix.version }}"
          if [ -f "$DIR/cli.js" ]; then
            echo "BUNDLE=$DIR/cli.js" >> "$GITHUB_ENV"
          elif [ -f "$DIR/cli.v${{ matrix.version }}.cjs" ]; then
            echo "BUNDLE=$DIR/cli.v${{ matrix.version }}.cjs" >> "$GITHUB_ENV"
          else
            echo "::warning::no JS bundle for v${{ matrix.version }}, attempting native-binary extract"
            make extract-from-binary VERSION=${{ matrix.version }}
            echo "BUNDLE=$DIR/cli.v${{ matrix.version }}.cjs" >> "$GITHUB_ENV"
          fi

      - name: Run patch verification tests
        run: npm run test:patches

      - name: Run doctor against v${{ matrix.version }}
        id: doctor
        run: |
          set +e
          node bin/patch-cli.mjs doctor "$BUNDLE" --version "${{ matrix.version }}" > /tmp/doctor.out 2>&1
          STATUS=$?
          cat /tmp/doctor.out
          echo "STATUS=$STATUS" >> "$GITHUB_OUTPUT"
          DRIFT_COUNT=$(grep -c "^  DRIFT" /tmp/doctor.out || true)
          MISSING_COUNT=$(grep -c "^  MISSING" /tmp/doctor.out || true)
          echo "DRIFT_COUNT=$DRIFT_COUNT" >> "$GITHUB_OUTPUT"
          echo "MISSING_COUNT=$MISSING_COUNT" >> "$GITHUB_OUTPUT"
          # Doctor exits 1 only on missing; drift is non-fatal.
          exit $STATUS

      - name: Check refmap coverage for v${{ matrix.version }}
        # Refmaps are mandatory for supported versions (the nightly drift
        # sweep fails without one); on the PR guard this is a warning so a
        # brand-new upstream release doesn't block unrelated PRs.
        run: |
          if [ ! -f "refmaps/${{ matrix.version }}.json" ]; then
            echo "::warning title=Missing refmap::refmaps/${{ matrix.version }}.json does not exist. Generate and commit one: node bin/patch-cli.mjs refmap \$BUNDLE --cc-version ${{ matrix.version }} --out refmaps/${{ matrix.version }}.json"
          else
            echo "refmap present for v${{ matrix.version }}"
          fi

      # Per-PR refmap freshness gate. Refmap REGENERATION is nightly only
      # (drift-check.yml refmap-pr, and only for @latest), so a PR that changes
      # anchor literals (runner/anchors.mjs) or patch anchors (core/,
      # extensions/) could pass CI while silently invalidating the committed
      # refmaps for supported versions. This step re-resolves the committed
      # refmap for THIS matrix version against the freshly downloaded bundle in
      # --check mode (tools/build-refmap.mjs compares everything except
      # generatedAt) and fails with regeneration instructions.
      #
      # This lives HERE (not ci.yml) because this workflow already resolves the
      # last 3 supported versions and downloads/caches their bundles — ci.yml
      # has no bundle to check against.
      #
      # Skips cleanly when:
      #   - the PR does not touch anchor-bearing paths (diff vs HEAD^1, the
      #     base tip of the merge commit checked out for pull_request events);
      #   - no refmap is committed for this version (the coverage warning in
      #     the previous step already flags that); or
      #   - the bundle is unavailable (defensive; earlier steps normally fail
      #     first). Versions OUTSIDE the last-3 matrix are not re-checked here
      #     at all — the nightly drift-check sweep probes every refmap'd
      #     version on disk and the refmap-pr job regenerates @latest, so a
      #     stale older refmap surfaces there within a day.
      - name: Refmap freshness for v${{ matrix.version }} (anchor-touching PRs)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # HEAD is the PR merge commit; HEAD^1 is the base tip. If the parent
          # is unavailable (unexpected), fail OPEN into running the check.
          if git rev-parse -q --verify 'HEAD^1' >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^1 HEAD -- runner/anchors.mjs core/ extensions/)
          else
            echo "::notice::cannot resolve HEAD^1 — running the refmap check unconditionally."
            CHANGED="(unknown — assuming anchor-bearing changes)"
          fi
          if [ -z "$CHANGED" ]; then
            echo "No anchor-bearing paths touched (runner/anchors.mjs, core/, extensions/) — skipping refmap freshness check."
            exit 0
          fi
          if [ ! -f "refmaps/${{ matrix.version }}.json" ]; then
            echo "::notice::no committed refmap for v${{ matrix.version }} — freshness check skipped (missing-refmap warning emitted above; the nightly drift-check refmap-pr job generates @latest refmaps)."
            exit 0
          fi
          if [ -z "${BUNDLE:-}" ] || [ ! -f "$BUNDLE" ]; then
            echo "::notice::bundle for v${{ matrix.version }} unavailable in CI — refmap freshness skipped; the nightly drift-check sweep covers this version once the bundle is obtainable."
            exit 0
          fi
          echo "Anchor-bearing changes in this PR:"
          echo "$CHANGED"
          if ! node tools/build-refmap.mjs "$BUNDLE" --cc-version "${{ matrix.version }}" --out "refmaps/${{ matrix.version }}.json" --check; then
            echo "::error title=Stale refmap for v${{ matrix.version }}::This PR changes anchor-bearing files but refmaps/${{ matrix.version }}.json no longer matches what build-refmap resolves. Regenerate and commit it: make download VERSION=${{ matrix.version }} && node tools/build-refmap.mjs <bundle> --cc-version ${{ matrix.version }} --out refmaps/${{ matrix.version }}.json (see SUPPORTED_VERSIONS.md)."
            exit 1
          fi
          echo "refmaps/${{ matrix.version }}.json is fresh against this PR's anchors."

      - name: Upload anchor-drift log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-drift-v${{ matrix.version }}
          path: storage/outputs/anchor-drift.jsonl
          if-no-files-found: ignore

      - name: Comment drift on PR
        if: always() && github.event_name == 'pull_request' && (steps.doctor.outputs.DRIFT_COUNT != '0' || steps.doctor.outputs.MISSING_COUNT != '0')
        uses: actions/github-script@v7
        env:
          MATRIX_VERSION: ${{ matrix.version }}
          DRIFT_COUNT: ${{ steps.doctor.outputs.DRIFT_COUNT }}
          MISSING_COUNT: ${{ steps.doctor.outputs.MISSING_COUNT }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.MATRIX_VERSION;
            const drift = process.env.DRIFT_COUNT || '0';
            const missing = process.env.MISSING_COUNT || '0';
            let driftBlock = '';
            try {
              const raw = fs.readFileSync('storage/outputs/anchor-drift.jsonl', 'utf8');
              const lines = raw.trim().split('\n').filter(Boolean).map(l => {
                try { return JSON.parse(l); } catch { return null; }
              }).filter(Boolean);
              const recent = lines.filter(e => e.source === 'doctor' && e.version === version);
              const byPatch = new Map();
              for (const e of recent) byPatch.set(e.patch, e);
              if (byPatch.size > 0) {
                const out = [];
                for (const e of byPatch.values()) {
                  out.push(`- **\`${e.patch}\`** — ${e.status}${e.detail ? `: ${e.detail}` : ''}`);
                  if (e.candidates?.length) {
                    const c = e.candidates[0];
                    out.push(`  - top candidate (score ${c.score.toFixed(2)}, from ${c.source}) @ offset ${c.offset}`);
                  }
                }
                driftBlock = out.join('\n');
              }
            } catch { /* no jsonl */ }
            const body = [
              `### version-matrix: v${version}`,
              ``,
              `- missing: \`${missing}\` (blocks merge)`,
              `- drift: \`${drift}\` (non-blocking — re-anchor at your convenience)`,
              ``,
              driftBlock || '_No detailed drift entries — see workflow logs._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
