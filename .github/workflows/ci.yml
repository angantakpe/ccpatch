name: ci

# Fast, self-contained CI that actually runs the bulk of the suite.
#
# The other two workflows are drift radars: drift-check.yml (nightly, @latest)
# and version-matrix.yml (per-PR, last 3 upstream versions) both run ONLY
# `npm run test:patches` + doctor against a real bundle. That left ~31 test
# files and all 5 lints running on no automated machine. This workflow closes
# that gap:
#
#   lint-and-test  — every push/PR: `bun run lint` + `bun run test:all`, plus
#                    the supply-chain gates: a frozen-lockfile integrity check
#                    (`bun install --frozen-lockfile`) and a dependency audit
#                    that fails on high/critical advisories. Needs no patched
#                    bundle, so it's fast and never flakes on upstream
#                    availability.
#   native-pipeline — every push/PR: exercises the REAL shipping path
#                    (extract -> patch -> repack into the native Bun binary),
#                    then boots the repacked binary. npm tarballs ship a native
#                    `claude`, not cli.js, and that path had ZERO coverage.
#                    Guarded to skip cleanly when no platform binary is
#                    obtainable rather than false-fail.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bun.lock is the SINGLE SOURCE OF TRUTH for dependencies (Item 3).
      # package-lock.json was removed; dependency installs go through bun against
      # bun.lock, never npm. node remains available below only because the test
      # suite runs `node --test`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lockfile integrity / sync guard (Item 3 + Item 6).
      # `--frozen-lockfile` installs strictly from bun.lock and FAILS if the
      # lockfile would have to change to satisfy package.json — i.e. bun.lock is
      # out of sync with package.json, or has been tampered with. This single
      # step doubles as both the install and the lockfile-integrity check.
      - name: Install dependencies (frozen lockfile = integrity check)
        run: bun install --frozen-lockfile

      # Supply-chain: dependency audit (Item 6).
      # Mechanically backs SECURITY.md's posture (the patcher makes no network
      # calls, ships no telemetry, no native build deps) as far as CI can: a
      # known-vulnerable dependency must not slip in. Fails the build on
      # high/critical advisories. `bun audit` is preferred; if this bun build
      # lacks the subcommand we fall back to `npm audit` against the same
      # dependency tree, and if NEITHER is available we skip-with-note rather
      # than false-fail.
      - name: Dependency audit (fail on high/critical)
        run: |
          set -euo pipefail
          if bun audit --help >/dev/null 2>&1; then
            echo "Running: bun audit --audit-level=high"
            bun audit --audit-level=high
          elif command -v npm >/dev/null 2>&1; then
            echo "bun audit unavailable; falling back to: npm audit --omit=dev --audit-level=high"
            npm audit --omit=dev --audit-level=high
          else
            echo "::warning::no audit subcommand available (bun audit absent, npm missing); skipping dependency audit"
          fi

      # Provenance attestation for PUBLISHED artifacts is intentionally NOT here:
      # it is handled in the publish workflow (WS5) via `npm publish --provenance`.

      # lint:types runs `gen-types` then `tsc`. Regenerating types/patch.d.ts in
      # CI is a no-op when the committed types are current; if they drift, the
      # tsc step (or a follow-up diff) surfaces it. We do NOT commit here.
      #
      # `npm run lint` includes `lint:anchors` (scripts/lint-anchors.mjs), the
      # anchor-resilience gate: it fails the build on any inline regex that pins
      # a minified shape without a stable literal and is not in the shrinking-only
      # ALLOWED_REGEX_ANCHORS allowlist. See docs/anchors.md §3.
      #
      # It also includes the two registry-consistency gates:
      #   lint:registry     — ccpatch.yml entries/acks/dependsOn vs the patch
      #                       corpus (scripts/lint-registry.mjs; reuses
      #                       loadPatches + validateManifest)
      #   lint:capabilities — declared `capabilities` vs syscall-shaped source
      #                       patterns (scripts/lint-capabilities.mjs)
      # Known pre-existing inconsistencies are warn-only via in-script
      # allowlists; new violations fail.
      - name: Lint
        run: bun run lint

      - name: Run full test suite
        run: bun run test:all

      # Coverage ratchet gate (scripts/check-coverage.mjs). `test:all` above owns
      # correctness; this step owns the coverage FLOOR so coverage can't silently
      # erode. Native threshold flags (--test-coverage-lines=) need Node >= 22 but
      # this job pins Node 20, so the script parses the `--experimental-test-coverage`
      # summary instead. Floors are a ratchet set a few points below the coverage
      # measured when the gate landed (line 68 / branch 62 / funcs 23); raise them
      # as coverage climbs. The gate keys off the produced coverage report, not the
      # test exit code, so it does not double-gate (or flake on) the suite's known
      # pty/timing-sensitive tests that `test:all` already covers.
      - name: Coverage gate (ratchet floor)
        run: bun run test:coverage:gate

      # tests/boot-tty.test.mjs — the Tier-4 interactive pty boot canary — is
      # part of test:all but needs a patched bundle in releases/ AND python3
      # with the pty module. This job builds no bundle, so the canary skips
      # here; that skip used to be silent (a Tier-4 coverage hole hiding in a
      # green run). Re-derive the test's own skip preconditions and surface
      # any skip in the step summary + a workflow warning. drift-canary.yml is
      # the workflow that actually exercises this tier against a real build.
      - name: Surface Tier-4 boot-tty skip
        if: always()
        run: |
          HAVE_BUNDLE=false
          ls releases/*/cli.v*.patched.*js >/dev/null 2>&1 && HAVE_BUNDLE=true
          HAVE_PY=false
          python3 -c 'import pty, select, termios' >/dev/null 2>&1 && HAVE_PY=true
          if [ "$HAVE_BUNDLE" = false ] || [ "$HAVE_PY" = false ]; then
            {
              echo "### ⚠️ Tier-4 pty boot canary SKIPPED (tests/boot-tty.test.mjs)"
              echo ""
              echo "- patched bundle in \`releases/\`: \`${HAVE_BUNDLE}\`"
              echo "- python3 with pty module: \`${HAVE_PY}\`"
              echo ""
              echo "The interactive boot-deadlock class (v2.1.175) is only caught by this tier."
              echo "Coverage relies on \`drift-canary.yml\` / a local \`make canary\` instead."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Tier-4 boot-tty canary skipped::boot-tty pty smoke did not run (bundle=${HAVE_BUNDLE} python3=${HAVE_PY}); see step summary."
          else
            echo "Tier-4 boot-tty preconditions met — canary ran in the suite above."
          fi

  native-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bun.lock is the single source of truth; install via bun (see lint-and-test).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Pin to @latest stable. The native binary is shipped per-platform on npm
      # (@anthropic-ai/claude-code-linux-x64); `make patch-claude-code-native`
      # pulls it via `make extract-from-binary`. We resolve the version up front
      # so every step below agrees on it.
      - name: Resolve target version
        id: ver
        run: |
          CC_VERSION="$(npm view @anthropic-ai/claude-code version)"
          if [ -z "$CC_VERSION" ]; then
            echo "::warning::could not resolve a claude-code version; skipping native pipeline"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Resolved claude-code version: $CC_VERSION"
            echo "version=$CC_VERSION" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Pre-flight: confirm the platform binary is actually downloadable for
      # this runner before we commit to the pipeline. If npm can't serve the
      # linux-x64 package (network, yank, new platform split), skip cleanly —
      # a missing upstream artifact is not a ccpatch regression.
      - name: Probe native binary availability
        id: probe
        if: steps.ver.outputs.skip != 'true'
        run: |
          set +e
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          PKG="@anthropic-ai/claude-code-${OS}-${ARCH}"
          VER="${{ steps.ver.outputs.version }}"
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "Platform binary ${PKG}@${VER} is available"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${PKG}@${VER} not available on npm; skipping native pipeline"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch native binary (extract -> patch -> repack)
        if: steps.probe.outputs.available == 'true'
        run: make patch-claude-code-native VERSION=${{ steps.ver.outputs.version }}

      # The repacked artifact is a native Bun executable at releases/<V>/claude.
      # Run it directly (NOT via node) and assert real Claude Code output. A
      # corrupt repack typically either fails to launch or drops into the bare
      # Bun runtime — both of which we fail loudly on here.
      - name: Smoke-test repacked native binary
        if: steps.probe.outputs.available == 'true'
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          BIN="releases/${VER}/claude"
          if [ ! -x "$BIN" ]; then
            echo "ERROR: expected repacked binary at $BIN, but it is missing or not executable"
            ls -la "releases/${VER}" || true
            exit 1
          fi
          echo "Booting native binary: $BIN --version"
          OUT="$("$BIN" --version 2>&1)"
          echo "Output: $OUT"
          # Must look like "X.Y.Z (Claude Code)" — anchor on the brand so a bare
          # Bun launch (which prints a bun version / usage banner) fails here.
          if ! printf '%s' "$OUT" | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+ \(Claude Code\)'; then
            echo "ERROR: native binary did not print expected Claude Code version line."
            echo "       This indicates a corrupt repack or a bare-bun launch."
            exit 1
          fi
          echo "Native binary booted and reported a Claude Code version."

      # Wire test:boot to run against a produced JS patched artifact. boot-smoke
      # globs releases/<V>/cli.v<V>.patched.mjs (the JS bundle), which is what
      # `make patch-claude-code` emits — distinct from the native `claude` above.
      # This catches init-time throws that a native-only smoke might mask.
      - name: Build JS patched bundle for boot smoke
        if: steps.probe.outputs.available == 'true'
        run: make patch-claude-code VERSION=${{ steps.ver.outputs.version }}

      - name: Boot smoke test (JS bundle)
        if: steps.probe.outputs.available == 'true'
        run: bun run test:boot

      # Deepen the smoke beyond `--version`: build a daemon-profile bundle (the
      # full headless stack — event_bus + bridge + expose_tool_dispatch +
      # expose_submit_input) and drive a real agent-loop + tool-dispatch
      # round-trip against a STUBBED Anthropic API (no network, no credentials).
      # `--version` exits before the agent loop / tool dispatch / API client
      # ever run; this proves the patched CLI actually executes a query and
      # dispatches a tool. `make patch-daemon` passes --allow-unacked because the
      # daemon profile is intentionally capability-gated (see ccpatch.yml).
      - name: Build daemon-profile bundle (headless stack)
        if: steps.probe.outputs.available == 'true'
        run: make patch-daemon VERSION=${{ steps.ver.outputs.version }}

      # integration_roundtrip.mjs auto-discovers the daemon bundle under
      # releases/ and exits 2 (clean skip) if none is present. The build step
      # above guarantees one exists, so on this gated path a skip would itself
      # be a regression — `make patch-daemon` either produced a bridge bundle or
      # failed loudly. A 90s default budget covers the ~40s boot + 2-turn loop.
      - name: Integration round-trip (agent loop + tool dispatch, stubbed API)
        if: steps.probe.outputs.available == 'true'
        timeout-minutes: 4
        run: bun run test:integration
