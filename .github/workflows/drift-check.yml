name: drift-check

on:
  schedule:
    # Nightly at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-check
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bun.lock is the single source of truth for dependencies; package-lock.json
      # was removed (see ci.yml). Install via bun, not npm — `cache: npm` / `npm ci`
      # fail here because there is no npm lockfile to key the cache or ci install on.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install latest Claude Code CLI
        run: |
          npm i -g @anthropic-ai/claude-code@latest
          CC_VERSION="$(npm ls -g @anthropic-ai/claude-code --depth=0 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.dependencies["@anthropic-ai/claude-code"].version)})')"
          echo "CC_VERSION=${CC_VERSION}" >> "$GITHUB_ENV"
          echo "Installed claude-code version: ${CC_VERSION}"

      - name: Locate installed claude-code bundle
        run: |
          CC_BIN="$(npm root -g)/@anthropic-ai/claude-code"
          if [ -f "${CC_BIN}/cli.js" ]; then
            echo "CC_BUNDLE=${CC_BIN}/cli.js" >> "$GITHUB_ENV"
          elif [ -f "${CC_BIN}/cli.mjs" ]; then
            echo "CC_BUNDLE=${CC_BIN}/cli.mjs" >> "$GITHUB_ENV"
          else
            echo "::warning::cli.js/cli.mjs not found under ${CC_BIN}; extracting from native binary"
            make extract-from-binary VERSION="${CC_VERSION}"
            echo "CC_BUNDLE=storage/archives/claude-code-v${CC_VERSION}/cli.v${CC_VERSION}.cjs" >> "$GITHUB_ENV"
          fi

      - name: Run patch verification tests
        run: npm run test:patches

      - name: Run doctor against installed claude-code
        run: node bin/patch-cli.mjs doctor "$CC_BUNDLE" --version "$CC_VERSION"

      # A3: Proactive drift sweep across @latest AND every known refmap'd
      # version. The plain `doctor` step above is the @latest leading indicator
      # but exits non-zero ONLY on MISSING (drift is a soft signal there). Here
      # we want the nightly radar to be loud on DRIFT too, and to re-probe the
      # versions we have hand-resolved refmaps for, so a regression in the
      # refmap loader / anchor registry surfaces before a user hits it.
      #
      # This complements the per-patch `revisit.until` runtime nudge
      # (runner/manifest.mjs + runner/runner.mjs): revisit.until reminds you
      # about a patch you KNOW is temporary; this sweep catches anchors that
      # moved when you DIDN'T expect them to. scripts/ci-drift-sweep.mjs only
      # probes bundles already on disk, so download the refmap'd versions first.
      - name: Fetch bundles for known refmap'd versions
        run: |
          for f in refmaps/*.json; do
            [ -e "$f" ] || continue
            v="$(basename "$f" .json)"
            dir="storage/archives/claude-code-v${v}"
            if [ ! -d "$dir" ] || ! ls "$dir"/cli*.cjs "$dir"/cli.js >/dev/null 2>&1; then
              echo "Downloading refmap'd version v${v}"
              make download VERSION="${v}" || echo "::warning::download for v${v} failed; sweep will skip it"
            fi
          done

      - name: Proactive drift sweep (@latest + refmap'd versions)
        # Distinct from the doctor step: this FAILS on DRIFT or MISSING for any
        # probed bundle, and that is also distinct from the lagging PR guard in
        # version-matrix.yml, where drift only comments and does not block.
        run: node scripts/ci-drift-sweep.mjs --latest "$CC_BUNDLE" --latest-version "$CC_VERSION"

      - name: Summarise drift results
        if: always()
        id: drift-summary
        run: |
          JSONL="storage/outputs/anchor-drift.jsonl"
          if [ ! -f "$JSONL" ]; then
            echo "✅ No anchor drift detected" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Parse the JSONL and build a markdown table.
          node - "$JSONL" <<'NODE_EOF'
          const fs = require('fs');
          const filePath = process.argv[1];
          const raw = fs.readFileSync(filePath, 'utf8').trim();
          if (!raw) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '✅ No anchor drift detected\n');
            process.exit(0);
          }

          const lines = raw.split('\n').map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
          // Deduplicate: latest record wins per (patch, version) pair.
          const byKey = new Map();
          for (const e of lines) {
            const key = `${e.patch}||${e.version ?? ''}`;
            byKey.set(key, e);
          }
          const entries = [...byKey.values()];

          if (entries.length === 0) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '✅ No anchor drift detected\n');
            process.exit(0);
          }

          // Build the step summary table.
          const rows = ['| Patch | Version | Drift Candidates |', '|-------|---------|-----------------|'];
          for (const e of entries) {
            const patch = e.patch ?? '(unknown)';
            const version = e.version ?? '(unknown)';
            const candidates = Array.isArray(e.candidates) ? e.candidates.length : 0;
            rows.push(`| ${patch} | ${version} | ${candidates} |`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join('\n') + '\n');

          // Set output variable for downstream steps.
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'drifted=true\n');

          // Emit per-version workflow annotations.
          const byVersion = new Map();
          for (const e of entries) {
            const v = e.version ?? 'unknown';
            if (!byVersion.has(v)) byVersion.set(v, []);
            byVersion.get(v).push(e.patch ?? '(unknown)');
          }
          for (const [v, patches] of byVersion) {
            process.stdout.write(`::warning::${patches.length} patch(es) drifted in version ${v}: ${patches.join(', ')}\n`);
          }
          NODE_EOF

      - name: Strict apply (capability gate)
        # Fails if any enabled patch declares high-risk capabilities the
        # allowlist doesn't acknowledge. The allowlist below covers what
        # ccpatch.yml ships enabled by default (network for fetch_interceptor /
        # tool_result_error_content, env for bun_shim). If a future change
        # turns on a patch that needs `tools`, `exec`, or `telemetry` by
        # default, this step will fail — that's the intended forcing function
        # for an explicit review.
        run: |
          node bin/patch-cli.mjs "$CC_BUNDLE" /tmp/cli.strict.mjs \
            --version "$CC_VERSION" \
            --strict \
            --allow-capabilities=network,env

      - name: Upload anchor-drift log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-drift-${{ env.CC_VERSION }}
          path: storage/outputs/anchor-drift.jsonl
          if-no-files-found: ignore

      - name: Report drift via GitHub issue
        if: failure()
        uses: actions/github-script@v7
        env:
          CC_VERSION: ${{ env.CC_VERSION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.CC_VERSION || 'unknown';
            const runUrl = process.env.RUN_URL;
            const titlePrefix = 'Drift detected against claude-code';
            const title = `${titlePrefix} ${version}`;

            // Pull the most recent drift entries from anchor-drift.jsonl so the
            // issue body names the specific patches + closest candidates.
            let driftBlock = '';
            try {
              const raw = fs.readFileSync('storage/outputs/anchor-drift.jsonl', 'utf8');
              const lines = raw.trim().split('\n').filter(Boolean).map(l => {
                try { return JSON.parse(l); } catch { return null; }
              }).filter(Boolean);
              const recent = lines.filter(e => e.source === 'doctor' && e.version === version);
              const byPatch = new Map();
              for (const e of recent) byPatch.set(e.patch, e);
              if (byPatch.size > 0) {
                const out = ['', '### Drifted patches', ''];
                for (const e of byPatch.values()) {
                  out.push(`**\`${e.patch}\`** — ${e.status}${e.detail ? `: ${e.detail}` : ''}`);
                  if (e.verify_failed?.length) {
                    for (const f of e.verify_failed.slice(0, 3)) out.push(`- ${f}`);
                  }
                  if (e.candidates?.length) {
                    const c = e.candidates[0];
                    out.push(`- Top candidate (score ${c.score.toFixed(2)}, from ${c.source}) @ offset ${c.offset}:`);
                    out.push('  ```');
                    out.push('  ' + (c.snippet || '').replace(/`/g, "'"));
                    out.push('  ```');
                  }
                  out.push('');
                }
                driftBlock = out.join('\n');
              }
            } catch { /* no jsonl — fall through */ }

            const body = [
              `Drift check failed on commit \`${context.sha}\`.`,
              ``,
              `- claude-code version: \`${version}\``,
              `- Failing run: ${runUrl}`,
              driftBlock,
              ``,
              `Full \`anchor-drift.jsonl\` is attached to the workflow run as an artifact.`,
              `This was generated automatically by \`.github/workflows/drift-check.yml\`.`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const match = existing.find(i => !i.pull_request && i.title.startsWith(titlePrefix));

            if (match) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: match.number,
                body,
              });
              core.info(`Commented on existing issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.info(`Opened new issue #${created.data.number}`);
            }

  # ── Refmap auto-PR ──────────────────────────────────────────────────────────
  # Detection of a missing refmap was automated (the drift job fails on it);
  # the REPAIR was a human remembering `make refmap`. This job closes that
  # loop: when @latest has no committed refmaps/<ver>.json, it generates the
  # refmap + the bun-api usage baseline, runs doctor and a --strict build
  # against the new bundle, and opens a PR carrying the artifacts plus both
  # reports. Review stays human — refmaps are trust-bearing — but the latency
  # drops from "whenever someone notices" to the next PR-queue pass.
  #
  # NOTE: PRs created with the default GITHUB_TOKEN do not trigger `on:
  # pull_request` workflows (GitHub recursion guard). CI runs on the PR after
  # a maintainer closes/reopens it (or pushes to the branch) — or switch
  # REFMAP_PR_TOKEN to a fine-grained PAT to get CI on creation.
  refmap-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install latest Claude Code CLI
        run: |
          npm i -g @anthropic-ai/claude-code@latest
          CC_VERSION="$(npm ls -g @anthropic-ai/claude-code --depth=0 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.dependencies["@anthropic-ai/claude-code"].version)})')"
          echo "CC_VERSION=${CC_VERSION}" >> "$GITHUB_ENV"
          echo "Installed claude-code version: ${CC_VERSION}"

      - name: Skip when the refmap is already committed
        id: presence
        run: |
          if [ -f "refmaps/${CC_VERSION}.json" ]; then
            echo "refmaps/${CC_VERSION}.json already exists — nothing to do."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "refmaps/${CC_VERSION}.json is MISSING — generating a PR."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when a refmap PR is already open
        id: existing
        if: steps.presence.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN="$(gh pr list --head "ci/refmap-v${CC_VERSION}" --state open --json number --jq length)"
          if [ "${OPEN}" != "0" ]; then
            echo "PR from ci/refmap-v${CC_VERSION} already open — not duplicating."
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate installed claude-code bundle
        if: steps.presence.outputs.missing == 'true' && steps.existing.outputs.open == 'false'
        run: |
          CC_BIN="$(npm root -g)/@anthropic-ai/claude-code"
          if [ -f "${CC_BIN}/cli.js" ]; then
            echo "CC_BUNDLE=${CC_BIN}/cli.js" >> "$GITHUB_ENV"
          elif [ -f "${CC_BIN}/cli.mjs" ]; then
            echo "CC_BUNDLE=${CC_BIN}/cli.mjs" >> "$GITHUB_ENV"
          else
            echo "cli.js/cli.mjs not found under ${CC_BIN}; extracting from native binary"
            make extract-from-binary VERSION="${CC_VERSION}"
            echo "CC_BUNDLE=storage/archives/claude-code-v${CC_VERSION}/cli.v${CC_VERSION}.cjs" >> "$GITHUB_ENV"
          fi

      - name: Generate refmap + bun-api usage baseline
        if: steps.presence.outputs.missing == 'true' && steps.existing.outputs.open == 'false'
        run: |
          make refmap VERSION="${CC_VERSION}" BUNDLE="${CC_BUNDLE}"
          node scripts/scan-bun-api.mjs "${CC_BUNDLE}" --version "${CC_VERSION}" --write-baseline \
            | tee /tmp/bun-api-report.txt

      - name: Doctor + strict build against the new bundle (reported, not blocking)
        if: steps.presence.outputs.missing == 'true' && steps.existing.outputs.open == 'false'
        run: |
          set +e
          node bin/patch-cli.mjs doctor "${CC_BUNDLE}" --version "${CC_VERSION}" > /tmp/doctor-report.txt 2>&1
          echo "DOCTOR_EXIT=$?" >> "$GITHUB_ENV"
          node bin/patch-cli.mjs "${CC_BUNDLE}" /tmp/cli.refmap.mjs \
            --version "${CC_VERSION}" --strict --allow-capabilities=network,env \
            > /tmp/strict-build.txt 2>&1
          echo "STRICT_EXIT=$?" >> "$GITHUB_ENV"
          tail -40 /tmp/doctor-report.txt
          tail -20 /tmp/strict-build.txt

      - name: Open the refmap PR
        if: steps.presence.outputs.missing == 'true' && steps.existing.outputs.open == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ci/refmap-v${CC_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add "refmaps/${CC_VERSION}.json" "refmaps/bun-api-usage.v${CC_VERSION}.json"
          git commit -m "ci(refmaps): add refmap + bun-api baseline for v${CC_VERSION}"
          git push -u origin "${BRANCH}" --force
          {
            echo "Nightly drift-check found no committed refmap for upstream \`v${CC_VERSION}\`."
            echo ""
            echo "Generated by \`.github/workflows/drift-check.yml\` (refmap-pr job):"
            echo "- \`refmaps/${CC_VERSION}.json\` — \`make refmap\` output"
            echo "- \`refmaps/bun-api-usage.v${CC_VERSION}.json\` — degraded-shim drift baseline"
            echo ""
            echo "**Doctor exit: ${DOCTOR_EXIT} · Strict build exit: ${STRICT_EXIT}** (0 = clean)"
            echo ""
            echo "<details><summary>bun-api scan</summary>"
            echo ""
            echo '```'
            cat /tmp/bun-api-report.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>doctor report (tail)</summary>"
            echo ""
            echo '```'
            tail -60 /tmp/doctor-report.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>strict build (tail)</summary>"
            echo ""
            echo '```'
            tail -40 /tmp/strict-build.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "Review checklist (refmaps are trust-bearing — do not rubber-stamp):"
            echo "- [ ] doctor is clean (0 missing / 0 drift) or the drift is understood"
            echo "- [ ] bun-api scan shows no DEGRADED-SHIM DRIFT, or the shim was verified for the new call site(s)"
            echo "- [ ] strict build (incl. runtime coverage gate) passed"
          } > /tmp/pr-body.md
          gh pr create \
            --title "ci(refmaps): v${CC_VERSION} refmap + bun-api baseline (auto-generated)" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${BRANCH}"
